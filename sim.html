<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Agent — Call Simulator</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,Segoe UI,Roboto,sans-serif; background:#0b1020; color:#e7ecf5; }
  header { padding:14px 18px; background:#111a3a; display:flex; align-items:center; gap:12px; }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  #status { font-size:12px; color:#9fb0cc; margin-left:auto; }
  .wrap { display:flex; gap:14px; padding:14px; height:calc(100vh - 52px); }
  .col { background:#0f1730; border:1px solid #1e2b50; border-radius:12px; display:flex; flex-direction:column; min-width:0; }
  .col.chat { flex:2; }
  .col.log { flex:1; }
  .col h2 { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:#8aa0c6; margin:0; padding:10px 14px; border-bottom:1px solid #1e2b50; }
  #transcript, #breakdown { flex:1; overflow:auto; padding:12px 14px; }
  .msg { margin:8px 0; max-width:85%; padding:8px 11px; border-radius:10px; font-size:14px; line-height:1.35; white-space:pre-wrap; }
  .agent { background:#23306a; }
  .customer { background:#2a2f3e; margin-left:auto; }
  .sys { background:transparent; color:#7d8db0; font-size:12px; max-width:100%; padding:2px 0; }
  .tag { display:inline-block; background:#3a2b5e; color:#d9c7ff; border-radius:6px; padding:0 6px; font-size:11px; margin-right:4px; }
  .controls { padding:12px 14px; border-top:1px solid #1e2b50; display:flex; gap:8px; flex-wrap:wrap; }
  input[type=text] { flex:1; min-width:160px; background:#fff; color:#0b1020; border:none; border-radius:8px; padding:10px; font-size:14px; }
  select { background:#1b2547; color:#e7ecf5; border:1px solid #2a3a66; border-radius:8px; padding:10px; font-size:13px; }
  button { border:none; border-radius:8px; padding:10px 14px; font-size:13px; font-weight:600; cursor:pointer; }
  #start { background:#16a34a; color:#fff; }
  #send { background:#2563eb; color:#fff; }
  #mic { background:#0891b2; color:#fff; }
  #mic.on { background:#dc2626; }
  #handoff { background:#dc2626; color:#fff; }
  #reset { background:#334155; color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  #breakdown div { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; color:#b9c6e0; padding:2px 0; }
</style>
</head>
<body>
<header>
  <h1>🎧 AI Agent — Call Simulator</h1>
  <span id="status">disconnected</span>
</header>
<div class="wrap">
  <div class="col chat">
    <h2>Conversation (you = customer)</h2>
    <div id="transcript"></div>
    <div class="controls">
      <select id="scenario" title="Call scenario">
        <option value="internet_lead">Internet Lead</option>
        <option value="missed_appointment">Missed Appointment</option>
        <option value="showroom_visit">Showroom Visit Follow-up</option>
        <option value="confirm_appointment">Confirm Appointment</option>
      </select>
      <button id="start">▶ Start call</button>
      <input id="text" type="text" placeholder="Type what the customer says… (Enter to send)" disabled />
      <button id="send" disabled>Send</button>
      <button id="mic" disabled>🎙 Talk</button>
      <button id="handoff" disabled>🎤 Take over</button>
      <button id="reset">↺ Reset</button>
    </div>
  </div>
  <div class="col log">
    <h2>Breakdown + emotion tags</h2>
    <div id="breakdown"></div>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const transcript = $('transcript'), breakdown = $('breakdown'), statusEl = $('status');
let ws, audioCtx, nextTime = 0, started = false;
let curAgentEl = null, curAgentText = '';

function setStatus(s){ statusEl.textContent = s; }
function scroll(el){ el.scrollTop = el.scrollHeight; }

function addMsg(cls, text){
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  transcript.appendChild(d); scroll(transcript);
  return d;
}
function addBreak(line){
  const d = document.createElement('div'); d.textContent = line;
  breakdown.appendChild(d); scroll(breakdown);
}
function ts(){ return '[' + ((performance.now()/1000)).toFixed(1) + 's] '; }

// ---- audio playback: PCM16 LE mono 24kHz streamed from the server ----
function playPcm(arrayBuf){
  if (!audioCtx) return;
  const pcm = new Int16Array(arrayBuf);
  const f32 = new Float32Array(pcm.length);
  for (let i=0;i<pcm.length;i++) f32[i] = pcm[i] / 32768;
  const buf = audioCtx.createBuffer(1, f32.length, 24000);
  buf.getChannelData(0).set(f32);
  const src = audioCtx.createBufferSource();
  src.buffer = buf; src.connect(audioCtx.destination);
  const now = audioCtx.currentTime;
  if (nextTime < now) nextTime = now;
  src.start(nextTime);
  nextTime += buf.duration;
}

function connect(){
  ws = new WebSocket((location.protocol==='https:'?'wss':'ws') + '://' + location.host + '/sim-ws');
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => setStatus('connected');
  ws.onclose = () => setStatus('disconnected');
  ws.onerror = () => setStatus('error');
  ws.onmessage = (ev) => {
    if (ev.data instanceof ArrayBuffer) { playPcm(ev.data); return; }
    const m = JSON.parse(ev.data);
    if (m.type === 'started') { addMsg('sys','— '+(m.scenario||'call')+' started —'); addBreak(ts()+'system.call_started: '+(m.scenario||'')); }
    else if (m.type === 'customer') { addBreak(ts()+'customer.said: '+m.text); }
    else if (m.type === 'agent_token') {
      if (!curAgentEl) { curAgentEl = addMsg('agent',''); curAgentText=''; }
      curAgentText += m.text; curAgentEl.textContent = curAgentText;
      scroll(transcript);
    }
    else if (m.type === 'agent_done') {
      // re-render with tags highlighted
      if (curAgentEl) {
        curAgentEl.innerHTML = '';
        (m.tags||[]).forEach(t => { const s=document.createElement('span'); s.className='tag'; s.textContent=t; curAgentEl.appendChild(s); });
        const span=document.createElement('span'); span.textContent=m.text; curAgentEl.appendChild(span);
      }
      addBreak(ts()+'agent.said: '+m.text + ((m.tags&&m.tags.length)?('  ⟨emotion: '+m.tags.join(' ')+'⟩'):''));
      curAgentEl=null; curAgentText='';
    }
    else if (m.type === 'handoff') {
      addMsg('sys','— agent triggered [[HANDOFF]] → would dial the manager —');
      addBreak(ts()+'agent.handoff_signal: [[HANDOFF]]');
      curAgentEl=null;
    }
    else if (m.type === 'log') { addBreak(ts()+m.text); }
    else if (m.type === 'reset_ok') { transcript.innerHTML=''; breakdown.innerHTML=''; addBreak(ts()+'reset'); }
  };
}

function ensureAudio(){
  if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

$('start').onclick = () => {
  ensureAudio();
  if (!ws || ws.readyState!==1) connect();
  const go = () => { ws.send(JSON.stringify({type:'start', scenario: $('scenario').value})); started=true; $('text').disabled=false; $('send').disabled=false; $('handoff').disabled=false; $('mic').disabled=false; $('text').focus(); };
  if (ws.readyState===1) go(); else ws.addEventListener('open', go, {once:true});
};

// ---- mic capture: stream linear16 16k PCM to the server (half-duplex) ----
let micOn = false, micStream = null, micSource = null, micNode = null, micSilent = null;
function agentSpeaking(){ return audioCtx && (audioCtx.currentTime < nextTime - 0.05); }
function resampleTo16k(float32, inRate){
  const ratio = inRate / 16000;
  const out = new Int16Array(Math.floor(float32.length / ratio));
  for (let i=0;i<out.length;i++){
    const v = float32[Math.floor(i*ratio)] || 0;
    out[i] = Math.max(-32768, Math.min(32767, v*32768));
  }
  return out;
}
async function micToggle(){
  if (micOn){ stopMic(); return; }
  ensureAudio();
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation:true, noiseSuppression:true, autoGainControl:true } });
  } catch(e){ addMsg('sys','mic blocked: '+e.message); return; }
  ws.send(JSON.stringify({type:'mic_start'}));
  micSource = audioCtx.createMediaStreamSource(micStream);
  micNode = audioCtx.createScriptProcessor(4096, 1, 1);
  micSilent = audioCtx.createGain(); micSilent.gain.value = 0; // don't echo mic to speakers
  micNode.onaudioprocess = (e) => {
    if (!micOn || !ws || ws.readyState!==1) return;
    if (agentSpeaking()) return; // half-duplex: don't capture while agent talks
    const pcm = resampleTo16k(e.inputBuffer.getChannelData(0), audioCtx.sampleRate);
    ws.send(pcm.buffer);
  };
  micSource.connect(micNode); micNode.connect(micSilent); micSilent.connect(audioCtx.destination);
  micOn = true; $('mic').textContent='⏹ Stop mic'; $('mic').classList.add('on');
  addMsg('sys','🎙 mic on — speak after the agent finishes (use headphones to avoid echo)');
}
function stopMic(){
  micOn = false; $('mic').textContent='🎙 Talk'; $('mic').classList.remove('on');
  try { ws.send(JSON.stringify({type:'mic_stop'})); } catch{}
  try { micNode.disconnect(); micSource.disconnect(); micSilent.disconnect(); } catch{}
  try { micStream.getTracks().forEach(t=>t.stop()); } catch{}
  micStream=micSource=micNode=micSilent=null;
}
$('mic').onclick = micToggle;
function sendText(){
  const t = $('text').value.trim(); if (!t || !started) return;
  ws.send(JSON.stringify({type:'say', text:t}));
  $('text').value='';
}
$('send').onclick = sendText;
$('text').addEventListener('keydown', (e)=>{ if(e.key==='Enter') sendText(); });
$('handoff').onclick = () => { ensureAudio(); if(ws&&ws.readyState===1) ws.send(JSON.stringify({type:'handoff'})); };
$('reset').onclick = () => { if(micOn) stopMic(); if(ws&&ws.readyState===1) ws.send(JSON.stringify({type:'reset'})); started=false; $('text').disabled=true; $('send').disabled=true; $('handoff').disabled=true; $('mic').disabled=true; nextTime=0; };

connect();
</script>
</body>
</html>
